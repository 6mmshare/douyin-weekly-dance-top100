timezone: Asia/Shanghai
window_mode: previous_7_complete_days
top_n_per_platform: 100
output_root: output
browser:
  headless: true
  background_window_x: -32000
  background_window_y: -32000
  slow_mo_ms: 0
  navigation_timeout_ms: 60000
  scrolls_per_keyword: 14
  scroll_pause_seconds: 1.35
  request_delay_seconds: 0.7
  keyword_delay_min_seconds: 12
  keyword_delay_max_seconds: 20
  verification_poll_seconds: 1.5
  verification_confirm_checks: 2
  verification_confirm_interval_seconds: 0.8
  verification_min_evidence_score: 4
  verification_wait_timeout_seconds: 600
  verification_stable_clear_seconds: 5
  verification_post_clear_delay_seconds: 4
  max_candidates_per_platform: 3000
  max_detail_visits_per_platform: 360
  detail_wait_seconds: 1.8
  checkpoint_batch_size: 20
  detail_delay_min_seconds: 2.2
  detail_delay_max_seconds: 4.8
  batch_rest_min_seconds: 18
  batch_rest_max_seconds: 40
  max_detail_attempts: 2
  failure_backoff_base_seconds: 3
  failure_backoff_max_seconds: 45
  consecutive_failure_cooldown_after: 4
  consecutive_failure_abort_after: 8
  cooldown_min_seconds: 45
  cooldown_max_seconds: 90
  lock_stale_hours: 12
  save_debug_screenshots: true
  headless_abort_after_empty_keywords: 4
  headless_min_candidates_before_empty_abort: 8
  repeated_result_jaccard_threshold: 0.88
  minimum_keyword_result_count: 5
