name: Sync creator recent7d tool

on:
  push:
    paths:
      - "bootstrap/creator-recent7d-20260803/ready.txt"

permissions:
  contents: write

jobs:
  sync-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/creator-recent7d-20260803/chunk-*.txt > /tmp/creator-recent7d.b64
          base64 --decode /tmp/creator-recent7d.b64 > /tmp/creator-recent7d.zip
          printf '%s  %s\n' 'bc22af9be6268c16ec38f3c85e396366b5b9be4e270c2dd75581be724fb609d0' '/tmp/creator-recent7d.zip' | sha256sum --check
          unzip -oq /tmp/creator-recent7d.zip -d .

      - name: Validate public package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            douyin_creator_recent7d_tool/creator_recent7d_core.py \
            douyin_creator_recent7d_tool/01_collect_recent_videos.py \
            douyin_creator_recent7d_tool/02_rank_recent_videos.py \
            douyin_creator_recent7d_tool/create_watchlist_template.py
          test ! -e douyin_creator_recent7d_tool/creators_watchlist.xlsx
          grep -q 'PROFILE_DIR = APP_DIR.parent / "data" / "profiles" / "douyin"' douyin_creator_recent7d_tool/creator_recent7d_core.py
          grep -q 'verification_required_consecutive_hits' douyin_creator_recent7d_tool/creator_recent7d_config.yaml
          grep -q 'normal_page_loaded' douyin_creator_recent7d_tool/01_collect_recent_videos.py

      - name: Remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/creator-recent7d-20260803
          rm -f .github/workflows/sync-creator-recent7d-20260803.yml
          rmdir bootstrap 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit public tool
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add creator recent-7-day collection and Top100 tool"
          git push
