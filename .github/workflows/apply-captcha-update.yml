name: Apply CAPTCHA monitoring update

on:
  push:
    paths:
      - "bootstrap/captcha-ready.txt"

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct update package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/captcha-chunk-*.txt > /tmp/captcha-update.b64
          base64 --decode /tmp/captcha-update.b64 > /tmp/captcha-update.zip
          printf '%s  %s\n' '3a625eec68e3cbf4f2df790750695e69d9f33ce209a49aa91053609846b4a8ea' '/tmp/captcha-update.zip' | sha256sum --check
          unzip -oq /tmp/captcha-update.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/apply-captcha-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve CAPTCHA monitoring and keyword pacing"
          git push
