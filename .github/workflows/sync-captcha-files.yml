name: Sync CAPTCHA fixes

on:
  push:
    paths:
      - "bootstrap/captcha-sync-ready.txt"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap/captcha-sync-package.b64 > /tmp/captcha-sync.zip
          printf '%s  %s\n' 'dbf57bee9f072dcffcae50f14feec3c33b4df90ad05528e564ed90830281322b' '/tmp/captcha-sync.zip' | sha256sum --check
          unzip -oq /tmp/captcha-sync.zip -d .
          rm -rf bootstrap
          rm -f .github/workflows/sync-captcha-files.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync CAPTCHA monitoring and false-positive fixes"
          git push
