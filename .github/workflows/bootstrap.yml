name: Bootstrap public source

on:
  push:
    paths:
      - "bootstrap/ready.txt"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and unpack source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.txt > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          printf '%s  %s\n' 'd6cfee037352923eda1fbc668597966bf4b8fd9c80f487dfa9f45ab488f18876' '/tmp/source.zip' | sha256sum --check
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          src="$(find /tmp/source -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$src"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name bootstrap ! -name .github -exec rm -rf {} +
          cp -a "$src"/. .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial open-source release"
          git push
